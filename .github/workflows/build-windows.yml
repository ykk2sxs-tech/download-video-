name: Build Windows app

# สร้างไฟล์ติดตั้ง VideoDownloader-Setup.exe และเวอร์ชันพกพา (ไม่ต้องติดตั้ง Python)
# - PR / push ทุกครั้ง: build + ทดสอบ แล้วเก็บไฟล์ไว้ในหน้า Actions → run → Artifacts
# - push เข้า main, กด "Run workflow" หรือ push tag v*: สร้าง GitHub Release ใหม่ให้ดาวน์โหลด
#   ลิงก์ถาวร: https://github.com/<owner>/<repo>/releases/latest/download/VideoDownloader-Setup.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build program folder (PyInstaller)
        run: python packaging/build.py

      - name: Smoke test portable build
        run: python packaging/smoke_test.py dist\VideoDownloader\VideoDownloader.exe

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.$env:GITHUB_RUN_NUMBER" }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\VideoDownloader-Setup.exe | Format-List Name, Length

      - name: Test installer (silent install + smoke test)
        run: |
          $p = Start-Process dist\VideoDownloader-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\VideoDownloader\VideoDownloader.exe"
          if (-not (Test-Path $exe)) { throw "installed exe not found: $exe" }
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcuts = Get-ChildItem "$desktop\*.lnk" -ErrorAction SilentlyContinue
          if (-not $shortcuts) { throw "desktop shortcut not created" }
          $shortcuts | ForEach-Object { Write-Output "shortcut: $($_.Name)" }
          python packaging/smoke_test.py $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: VideoDownloader-Setup
          path: dist/VideoDownloader-Setup.exe
          if-no-files-found: error

      - name: Upload portable version
        uses: actions/upload-artifact@v5
        with:
          name: VideoDownloader-Portable
          path: dist/VideoDownloader/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: [test, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pick release tag
        id: tag
        run: |
          # ใช้ชื่อ tag ที่ push มา หรือสร้างใหม่ให้ตรงกับเลขเวอร์ชันของตัวติดตั้ง (1.0.<run number>)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v1.0.$GITHUB_RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Zip portable version
        run: |
          cd artifacts
          mv VideoDownloader-Portable VideoDownloader
          zip -qr VideoDownloader-Portable.zip VideoDownloader
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Video Downloader ${{ steps.tag.outputs.tag }}
          make_latest: true
          files: |
            artifacts/VideoDownloader-Setup/VideoDownloader-Setup.exe
            artifacts/VideoDownloader-Portable.zip
          body: |
            ## ดาวน์โหลด (Windows 10/11 แบบ 64-bit)

            | ไฟล์ | ใช้เมื่อ |
            |---|---|
            | **VideoDownloader-Setup.exe** | ติดตั้งลงเครื่อง มีไอคอนบนหน้าจอ (แนะนำ) |
            | **VideoDownloader-Portable.zip** | ไม่ต้องติดตั้ง — แตกไฟล์แล้วดับเบิลคลิก `VideoDownloader.exe` |

            ## วิธีติดตั้ง

            1. คลิก **VideoDownloader-Setup.exe** ในหัวข้อ Assets ด้านล่างเพื่อดาวน์โหลด
            2. ดับเบิลคลิกไฟล์ → กด **Next** → **Install** (ไม่ต้องใช้สิทธิ์ Admin)
               - ถ้าขึ้น **"Windows protected your PC"** ให้กด **More info → Run anyway**
                 (โปรแกรมยังไม่ได้ซื้อใบรับรอง code signing ไม่ใช่ไวรัส)
            3. เปิดโปรแกรมจากไอคอน **"โหลดวิดีโอ"** บนหน้าจอ → เบราว์เซอร์จะเปิดหน้าแอปเอง
            4. คัดลอกลิงก์ YouTube / Facebook / Zoom มาวาง → เลือกคุณภาพ → ดาวน์โหลด
            5. ไฟล์จะอยู่ที่ **Downloads\VideoDownloader** — ปิดหน้าต่างสีดำเมื่อเลิกใช้

            ถ้าวันหนึ่งโหลดจาก YouTube/Facebook ไม่ได้ ให้ดาวน์โหลดเวอร์ชันใหม่ล่าสุดจากหน้านี้มาติดตั้งทับ

            ใช้ดาวน์โหลดเฉพาะวิดีโอที่คุณมีสิทธิ์ใช้งาน เช่น บันทึกการประชุมของบริษัท หรือคลิปของตัวเอง
          generate_release_notes: true
